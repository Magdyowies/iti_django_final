{% extends 'base.html' %}

{% block content %}
  <h1>Delete Project</h1>
  <p>Are you sure you want to delete "{{ object.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'project-detail' object.pk %}">Cancel</a>
  </form>
{% endblock %}
