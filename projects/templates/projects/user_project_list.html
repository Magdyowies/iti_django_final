{% extends 'base.html' %}

{% block content %}
  <h1>My Projects</h1>
  {% for project in projects %}
    <div>
      <h2><a href="{% url 'project-detail' project.pk %}">{{ project.title }}</a></h2>
      <p>Target: {{ project.target_amount }} EGP</p>
    </div>
  {% empty %}
    <p>You have not created any projects yet.</p>
  {% endfor %}
{% endblock %}
