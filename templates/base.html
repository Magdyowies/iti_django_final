<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CrowdFund Console{% endblock %}</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f0f2f5; /* Light gray background */
            color: #333;
            line-height: 1.6;
        }

        /* Navigation Bar */
        nav {
            background-color: #2c3e50; /* Dark blue-gray */
            color: white;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            display: block;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        nav ul li a:hover {
            background-color: #34495e; /* Slightly lighter dark blue-gray */
        }
        nav form {
            display: inline-block;
        }
        nav button[type="submit"] {
            background-color: #e74c3c; /* Red for logout */
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }
        nav button[type="submit"]:hover {
            background-color: #c0392b; /* Darker red */
        }

        /* Container for main content */
        .container {
            max-width: 960px;
            margin: 30px auto;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Messages */
        .messages {
            list-style: none;
            padding: 15px;
            margin: 20px auto;
            max-width: 960px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .messages li {
            margin-bottom: 10px;
        }
        .messages .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .messages .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .messages .warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        /* Form Elements */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        textarea,
        select {
            width: calc(100% - 24px); /* Account for padding and border */
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
        }
        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 5px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        button,
        input[type="submit"] {
            background-color: #28a745; /* Green */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }
        button:hover,
        input[type="submit"]:hover {
            background-color: #218838; /* Darker green */
        }

        /* Basic Typography */
        h1, h2, h3, h4, h5, h6 {
            color: #2c3e50; /* Dark blue-gray for headings */
            margin-top: 0;
            margin-bottom: 15px;
        }
        a {
            color: #3498db; /* Blue for general links */
            text-decoration: none;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #21618c; /* Darker blue */
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="{% url 'project-list' %}">Home</a></li>
            <li><a href="{% url 'project-list' %}">Projects</a></li>
            <li><a href="{% url 'my-projects' %}">My Projects</a></li>
            {% if user.is_authenticated %}
                <li><a href="{% url 'project-create' %}">Create Project</a></li>
                <li>
                    <form action="{% url 'logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit">Logout</button>
                    </form>
                </li>
            {% else %}
                <li><a href="{% url 'register' %}">Register</a></li>
                <li><a href="{% url 'login' %}">Login</a></li>
            {% endif %}
        </ul>
    </nav>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
